<!DOCTYPE html>
<html>
<head>
    <title>Travel Recommendation</title>
</head>
<body>
    <nav>
        <a href="index.html">Home</a> |
        <a href="about.html">About Us</a> |
        <a href="contact.html">Contact Us</a> |
        <input type="text" id="searchInput" placeholder="Search...">
        <button onclick="search()">Search</button>
        <button onclick="clearSearch()">Clear</button>
    </nav>
    <h1>Welcome to Travel Recommendation</h1>
    <p>This website helps you find the best beaches, temples, and travel spots based on your favorite country.</p>

    <div id="results"></div>

    <script>
        function search() {
            var input = document.getElementById("searchInput").value.toLowerCase();
            var results = document.getElementById("results");
            results.innerHTML = "";

            if (input.includes("beach")) {
                results.innerHTML = `
                    <h2>Beach Recommendations</h2>
                    <h3>Maldives Beach</h3>
                    <img src="https://images.unsplash.com/photo-1514282401047-d79a71a590e8?w=400" width="400">
                    <h3>Bora Bora Beach</h3>
                    <img src="https://images.unsplash.com/photo-1589197331516-4d84b72ebde3?w=400" width="400">
                `;
            } else {
                results.innerHTML = "<p>No results found. Try searching 'beach'.</p>";
            }
        }
        function clearSearch() {
            document.getElementById("searchInput").value = "";
            document.getElementById("results").innerHTML = "";
        }
    </script>
</body>
</html>
